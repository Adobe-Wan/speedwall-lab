# DEFERRED 2026-10-09 (no second pilot available); kept for later.
# Round 13 (Gladius, DECOUPLED, Arena Commander FREE FLIGHT only, both pilots present): MEASURE THE SHOOTER. TWO PILOTS.
#   python run.py run --tests tests_round13.yaml
#
# The harness flies the TARGET; a second pilot, 550 m behind in an identical Gladius, shoots at the pip. Protocol, hit counting
# and how to read the result: docs/aim-model.md section 3. The step lists are the sequences scored in that note, generated by
# `node tools/aim-study.mjs --yaml`; regenerate them rather than hand-edit, so the model and the flight stay identical.
# Each test: 6 s boosted run-up to the nose (the shooter runs up at the same moment, so the range holds), then 10 s of pattern.
# The shooter fires three 2 s bursts at 2-4, 5-7 and 8-10 s into the pattern and must not know which pattern is coming:
# fly 3 x each, shuffled, straight first and last.
#
# CLAUDE.md: the harness is never used in PvP. A friend shooting at the harness ship in private free flight needs Alex's OK
# first; without it, the target flies these sequences by hand.
tests:
  - id: r13_aim_straight
    note: "baseline: forward held, no dodge (divide every other pattern by this)"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 10, strafe_long: 1, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "100 / 100"}
  - id: r13_aim_taps_mixed
    note: "the alpha flee-wall taps: side and up, 0.25-0.5 s, irregular, forward held"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.5, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.7, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.4, strafe_long: 1, boost: true}, {t: 0.25, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.65, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.4, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.7, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.4, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.7, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.4, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.6, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.3, strafe_long: 1, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "43 / 68"}
  - id: r13_aim_taps_side
    note: "side taps only, left/right, same timing style (seed 1)"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 0.41, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.64, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.5, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.9, strafe_long: 1, boost: true}, {t: 0.36, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.51, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.59, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.51, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.75, strafe_long: 1, boost: true}, {t: 0.36, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.9, strafe_long: 1, boost: true}, {t: 0.31, strafe_long: 1, strafe_lat: 1, boost: true}, {t: 0.53, strafe_long: 1, boost: true}, {t: 0.35, strafe_long: 1, strafe_lat: -1, boost: true}, {t: 0.49, strafe_long: 1, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "80 / 100"}
  - id: r13_aim_taps_updown
    note: "up/down taps only, same timing style (seed 1): the thin-axis test"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 0.41, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.64, strafe_long: 1, boost: true}, {t: 0.5, strafe_long: 1, strafe_vert: -1, boost: true}, {t: 0.5, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.9, strafe_long: 1, boost: true}, {t: 0.36, strafe_long: 1, strafe_vert: -1, boost: true}, {t: 0.51, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.59, strafe_long: 1, boost: true}, {t: 0.4, strafe_long: 1, strafe_vert: -1, boost: true}, {t: 0.51, strafe_long: 1, boost: true}, {t: 0.3, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.75, strafe_long: 1, boost: true}, {t: 0.36, strafe_long: 1, strafe_vert: -1, boost: true}, {t: 0.9, strafe_long: 1, boost: true}, {t: 0.31, strafe_long: 1, strafe_vert: 1, boost: true}, {t: 0.53, strafe_long: 1, boost: true}, {t: 0.35, strafe_long: 1, strafe_vert: -1, boost: true}, {t: 0.49, strafe_long: 1, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "28 / 52"}
  - id: r13_aim_ck_escape
    note: "escape corkscrew: forward + up, roll 60 deg/s (stick .25), reversing at 3.5 / 6 / 8.5 s"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 3.5, strafe_long: 1, strafe_vert: 1, roll: 0.25, boost: true}, {t: 2.5, strafe_long: 1, strafe_vert: 1, roll: -0.25, boost: true}, {t: 2.5, strafe_long: 1, strafe_vert: 1, roll: 0.25, boost: true}, {t: 1.5, strafe_long: 1, strafe_vert: 1, roll: -0.25, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "2 / 29"}
  - id: r13_aim_held_up
    note: "held up-strafe, no roll: the velocity swings off the line and the shooter closes"
    steps: [{t: 6, strafe_long: 1, boost: true}, {t: 10, strafe_long: 1, strafe_vert: 1, boost: true}]
    expect: {hit_ratio_vs_straight: "?", model_tau025_AB_pct: "60 / 83"}
