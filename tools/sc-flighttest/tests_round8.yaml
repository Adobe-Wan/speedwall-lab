    note: "SCM forward + full right + full roll 15 s, held through any blackout"
    probe: 1.0
    gloc: hold
    steps: [{t: 15, strafe_long: 1.0, strafe_lat: 1.0, roll: 1.0}]
    expect: {grey_at: "~3.6 (round 7)", true_blackout_at: "?"}
