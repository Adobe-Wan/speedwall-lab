    steps: [{t: 10, strafe_vert: -1.0, boost: true}]
    expect: {red_at: "?"}

  # --- E. Onset by axis with the camera probe (round 7 A used the HUD alone and let go at the blackout). Matched ~10 G:
  #        lateral 9.95, up 9.9; down is weaker (4.97), so compare it with up at 50 %.
