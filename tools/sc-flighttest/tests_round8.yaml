  # --- F. Countermeasures (ADVANCED, 201+): when the screen is practically black, the harness waits 0.8 s, then reverses
  #        the strafe and roll direction (a pilot counter-strafing), holds that until vision is back, resumes, repeats.
  #        Logged in meta "reversals" with the darkness level at each flip; analyze reports how long vision took to return.
  - id: r8_cm_lat_scm
    note: "countermeasure: SCM forward + full right + full roll, reverse the corkscrew when practically black, 18 s"
    probe: 1.0
    gloc: reverse
    steps: [{t: 18, strafe_long: 1.0, strafe_lat: 1.0, roll: 1.0}]
    expect: {reversals: "?", vision_back_s: "?"}
