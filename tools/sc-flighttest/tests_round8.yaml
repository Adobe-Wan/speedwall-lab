# Round 8 (Gladius, DECOUPLED, Arena Commander only): what corkscrews do to the pilot, and which one is worth flying.
#   python run.py camcheck                                (once: does the camera key work, and do the three views look different?)
#   python run.py run --tests tests_round8.yaml           (about 55 tests, about 60 minutes)   or:  python run.py campaign --rounds 8
#
# WHY. The simulator needs (1) what a blackout / grey-out / RED-out looks and feels like over time, so the pilot view can
# show it; (2) which corkscrews black you out, and when; (3) the corkscrew that maximises deflection for a pilot who is
# escaping with everything: boost, forward, strafe AND roll, all started BEFORE the speedwall, as in a real fight.
# Teaching levels: 101 / 201 corkscrews fly one direction (no counter-strafing). Reversing the corkscrew to stay conscious
# is an ADVANCED countermeasure, tested only in section F (policy "reverse"), never in the others ("hold").
#
# WHAT IS RECORDED in every test (analyze writes summary.csv and a vision.csv per test):
#   * the vision gradient, continuously: how dark the centre of the screen is (0 clear .. 1 black), how dark the edge is
#     versus the centre (tunnel vision), the red share of the picture (red-out), the HUD digits' fade, with your inputs;
#   * the camera-key probe: the vJoy `view` button (bound to Star Citizen's camera cycle: cockpit -> external A ->
#     external B) is pressed every ~1 s. The camera still switching means you are not truly blacked out. The moment the
#     screen goes dark, a BLACK CHECK is pressed at once and every 0.7 s while it lasts: camera switched = still
#     conscious; nothing = a TRUE blackout. analyze reports true_blackout_at, conscious_dark_at, key_lost_at, ...
#   * a "hold" test never lets go of the controls: the inputs run to the end whatever the screen looks like.
# The HUD digits (speed, G) exist only in the cockpit view, so flight numbers come from the cockpit windows of each test.
# `python run.py camstrip <session> <test>` draws the frames around each press, to check by eye.
#
# Sections: A the corkscrew map (30, from rest, forward + strafe + roll started together), B escape corkscrews with
# boost from rest and from a running start, C red-out (down strafe), D held strafes, E onset by axis, F countermeasures.
