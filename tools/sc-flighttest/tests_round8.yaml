  # --- D. Held strafes with no roll: a full down strafe pulls G for as long as the ship accelerates (SCM ~4.6 s at 4.97 G,
  #        boosted ~6 s at 6.6 G). Does a plain held strafe red you out?
  - id: r8_hold_down_scm
    note: "SCM full DOWN strafe held 9 s (accelerates ~4.6 s, then constant speed)"
    probe: 1.0
    gloc: hold
    steps: [{t: 9, strafe_vert: -1.0}]
    expect: {red_at: "?"}
  - id: r8_hold_down_boost
