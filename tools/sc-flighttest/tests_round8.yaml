  - id: r8_bst_f100_up_r75
    note: "boosted escape from rest: forward 100 % + full up + roll 75 % (180 deg/s), 14 s"
    probe: 1.0
    gloc: hold
    steps: [{t: 14, strafe_long: 1.0, strafe_vert: 1.0, roll: 0.75, boost: true}]
    expect: {true_blackout_at: "?", plateau_mps: "?"}
  - id: r8_bst_f100_lat_r75
    note: "boosted escape from rest: forward 100 % + full right + roll 75 % (180 deg/s), 14 s"
    probe: 1.0
